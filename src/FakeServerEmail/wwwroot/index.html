<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake Server Email</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='6' width='28' height='20' rx='4' fill='%232f6fde'/%3E%3Cpath d='M5 10l11 8 11-8' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<header class="topbar" x-data x-cloak>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="6" width="28" height="20" rx="4"/><path d="M5 10l11 8 11-8"/></svg>
    <span>Fake Server Email</span>
  </div>
  <nav class="tabs" role="tablist">
    <template x-for="tab in $store.app.tabs" :key="tab.id">
      <button role="tab" :data-view="tab.id" :class="{ active: $store.app.view === tab.id }" :aria-selected="$store.app.view === tab.id" @click="$store.app.setView(tab.id)">
        <span x-text="tab.label"></span>
        <span class="badge" x-show="tab.id === 'inbox' && $store.app.unread > 0" x-text="$store.app.unread"></span>
      </button>
    </template>
  </nav>
  <div class="services">
    <template x-for="pill in $store.app.pills" :key="pill.label">
      <span class="pill" :class="pill.state" :title="pill.title"><span x-text="pill.label"></span> <b x-text="pill.ports"></b></span>
    </template>
  </div>
</header>

<main>
  <div data-include="views/inbox.html"></div>
  <div data-include="views/oauth.html"></div>
  <div data-include="views/sessions.html"></div>
  <div data-include="views/connect.html"></div>
  <div data-include="views/settings.html"></div>
</main>

<div data-include="views/send-dialog.html"></div>

<div class="toast" x-data x-cloak x-show="$store.app.toast.visible" :class="{ error: $store.app.toast.error }" x-text="$store.app.toast.text" role="status"></div>

<div class="stopped" x-data x-cloak x-show="$store.app.stopped">
  <div>
    <h2 x-text="$store.app.stopped?.title"></h2>
    <p x-text="$store.app.stopped?.message"></p>
    <p x-show="$store.app.stopped?.path"><code x-text="$store.app.stopped?.path"></code></p>
    <p x-show="$store.app.stopped?.warning" style="color: var(--danger)" x-text="$store.app.stopped?.warning"></p>
    <p x-show="$store.app.stopped?.hint" x-text="$store.app.stopped?.hint"></p>
  </div>
</div>
</body>
</html>
